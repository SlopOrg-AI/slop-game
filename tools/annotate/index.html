<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Board Annotator</title>
<style>
  :root {
    --bg: #17181b; --panel: #1e2024; --panel-2: #24272c; --line: #33373e;
    --text: #e6e7ea; --dim: #9aa0aa; --accent: #6ea8fe; --warn: #e5a04c;
    --pin: #ff7a59; --box: #5ad1a4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    height: 100vh; display: grid; grid-template-columns: 240px 1fr 330px;
  }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
       color: var(--dim); margin: 0 0 10px; font-weight: 600; }
  aside { background: var(--panel); border-right: 1px solid var(--line);
          padding: 14px; overflow-y: auto; }
  aside.right { border-right: 0; border-left: 1px solid var(--line);
                display: flex; flex-direction: column; }

  .board { padding: 7px 9px; border-radius: 6px; cursor: pointer;
           font-size: 12.5px; word-break: break-all; color: var(--dim); }
  .board:hover { background: var(--panel-2); color: var(--text); }
  .board.active { background: #2c3340; color: var(--text); }
  .board .n { float: right; color: var(--accent); font-variant-numeric: tabular-nums; }

  main { display: flex; flex-direction: column; overflow: hidden; }
  .bar { display: flex; gap: 8px; align-items: center; padding: 10px 14px;
         border-bottom: 1px solid var(--line); background: var(--panel); }
  .bar .spacer { flex: 1; }
  button { background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
           border-radius: 6px; padding: 6px 11px; cursor: pointer; font-size: 13px; }
  button:hover { border-color: #4a515c; }
  button[data-tool].on { background: #32405a; border-color: var(--accent); color: #fff; }
  button.primary { background: #2f5fbf; border-color: #3f70d0; color: #fff; }
  button.primary[disabled] { opacity: .4; cursor: default; }
  .hint { color: var(--dim); font-size: 12px; }

  .stage { flex: 1; overflow: auto; display: grid; place-items: center; padding: 20px; }
  .wrap { position: relative; line-height: 0; }
  .wrap img { max-width: 100%; display: block; user-select: none; -webkit-user-drag: none; }
  svg.overlay { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; }

  .marker circle, .marker rect { vector-effect: non-scaling-stroke; }
  .marker.sel circle, .marker.sel rect { stroke: #fff; }
  .marker text { font: 600 13px ui-sans-serif, system-ui; fill: #14161a; }

  .notes { flex: 1; overflow-y: auto; margin: -4px -4px 8px; padding: 4px; }
  .note { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
          padding: 9px; margin-bottom: 8px; }
  .note.sel { border-color: var(--accent); }
  .note header { display: flex; align-items: center; gap: 7px; margin-bottom: 6px; }
  .badge { width: 21px; height: 21px; border-radius: 50%; display: grid; place-items: center;
           font-size: 11.5px; font-weight: 700; color: #14161a; flex: none; }
  .note select { background: var(--bg); color: var(--text); border: 1px solid var(--line);
                 border-radius: 5px; padding: 3px 5px; font-size: 12px; flex: 1; }
  .note textarea { width: 100%; min-height: 54px; resize: vertical; background: var(--bg);
                   color: var(--text); border: 1px solid var(--line); border-radius: 5px;
                   padding: 6px; font: inherit; font-size: 13px; }
  .note .del { background: none; border: 0; color: var(--dim); padding: 2px 5px; font-size: 15px; }
  .note .del:hover { color: #ff7a7a; }
  .empty { color: var(--dim); font-size: 12.5px; padding: 8px 2px; }
  .status { font-size: 12px; color: var(--dim); min-height: 18px; }
</style>
</head>
<body>

<aside class="left">
  <h2>Boards</h2>
  <div id="boards"><div class="empty">loading…</div></div>
</aside>

<main>
  <div class="bar">
    <button data-tool="pin" class="on">Pin</button>
    <button data-tool="box">Box</button>
    <span class="hint" id="tip">click to drop a pin</span>
    <span class="spacer"></span>
    <span class="status" id="status"></span>
    <button class="primary" id="save" disabled>Save</button>
  </div>
  <div class="stage">
    <div class="wrap" id="wrap" hidden>
      <img id="img" alt="">
      <svg class="overlay" id="ov" preserveAspectRatio="none"></svg>
    </div>
    <div class="empty" id="placeholder">Pick a board on the left.</div>
  </div>
</main>

<aside class="right">
  <h2>Notes</h2>
  <div class="notes" id="notes"><div class="empty">No annotations yet.</div></div>
  <div class="hint">Saved beside the image as <code>&lt;name&gt;.annotations.json</code></div>
</aside>

<script>
const TAGS = ["line","palette","shading","silhouette","proportion",
              "composition","framing","texture","other"];

let boards = [], current = null, anns = [], sel = null, tool = "pin", dirty = false;

const $ = s => document.querySelector(s);
const ovEl = $("#ov"), imgEl = $("#img");

function setDirty(v) { dirty = v; $("#save").disabled = !v || !current; }
function status(msg) { $("#status").textContent = msg; }

// ---------- boards ----------
async function loadBoards() {
  const r = await fetch("/api/boards").then(r => r.json());
  boards = r.boards;
  const host = $("#boards");
  if (!boards.length) { host.innerHTML = '<div class="empty">No images under proposals/art.</div>'; return; }
  host.innerHTML = "";
  for (const b of boards) {
    const el = document.createElement("div");
    el.className = "board" + (current === b.path ? " active" : "");
    el.innerHTML = `${b.path}${b.annotations ? `<span class="n">${b.annotations}</span>` : ""}`;
    el.onclick = () => openBoard(b.path);
    host.appendChild(el);
  }
}

async function openBoard(path) {
  if (dirty && !confirm("Discard unsaved notes on this board?")) return;
  current = path; sel = null;
  imgEl.src = "/img/" + path.split("/").map(encodeURIComponent).join("/");
  $("#wrap").hidden = false; $("#placeholder").hidden = true;
  const data = await fetch("/api/annotations?path=" + encodeURIComponent(path)).then(r => r.json());
  anns = (data.annotations || []).map((a, i) => ({ id: a.id || "a" + (i + 1), ...a }));
  setDirty(false); status(anns.length ? `${anns.length} note(s) loaded` : "");
  loadBoards(); render();
}

// ---------- geometry ----------
function relPoint(evt) {
  const r = ovEl.getBoundingClientRect();
  return {
    x: Math.min(1, Math.max(0, (evt.clientX - r.left) / r.width)),
    y: Math.min(1, Math.max(0, (evt.clientY - r.top) / r.height)),
  };
}

let drag = null;
ovEl.addEventListener("pointerdown", e => {
  if (!current) return;
  const p = relPoint(e);
  if (tool === "pin") { add({ kind: "pin", x: p.x, y: p.y }); return; }
  drag = { x0: p.x, y0: p.y, x1: p.x, y1: p.y };
  ovEl.setPointerCapture(e.pointerId);
});
ovEl.addEventListener("pointermove", e => {
  if (!drag) return;
  const p = relPoint(e); drag.x1 = p.x; drag.y1 = p.y; renderOverlay();
});
ovEl.addEventListener("pointerup", e => {
  if (!drag) return;
  const d = drag; drag = null;
  const x = Math.min(d.x0, d.x1), y = Math.min(d.y0, d.y1);
  const w = Math.abs(d.x1 - d.x0), h = Math.abs(d.y1 - d.y0);
  if (w > 0.012 && h > 0.012) add({ kind: "box", x, y, w, h }); else renderOverlay();
});

function add(geom) {
  const n = (anns.length ? Math.max(...anns.map(a => +String(a.id).replace(/\D/g, "") || 0)) : 0) + 1;
  const a = { id: "a" + n, tag: "other", note: "", ...geom };
  anns.push(a); sel = a.id; setDirty(true); render();
  const ta = document.querySelector(`.note[data-id="${a.id}"] textarea`);
  if (ta) ta.focus();
}

// ---------- render ----------
// Selection must NOT rebuild the notes DOM: doing so destroys the textarea the
// user just clicked into and swallows their keystrokes. Overlay and notes are
// rendered separately, and selection only toggles classes.
function syncSelection() {
  ovEl.querySelectorAll(".marker").forEach(g =>
    g.classList.toggle("sel", g.dataset.id === sel));
  document.querySelectorAll(".note").forEach(n =>
    n.classList.toggle("sel", n.dataset.id === sel));
}

function render() { renderOverlay(); renderNotes(); }

function renderOverlay() {
  const round = v => Math.round(v * 1e4) / 1e4;
  let svg = "";
  anns.forEach((a, i) => {
    const s = a.id === sel ? " sel" : "";
    const label = i + 1;
    if (a.kind === "box") {
      svg += `<g class="marker${s}" data-id="${a.id}">
        <rect x="${round(a.x) * 100}%" y="${round(a.y) * 100}%"
              width="${round(a.w) * 100}%" height="${round(a.h) * 100}%"
              fill="rgba(90,209,164,.13)" stroke="var(--box)" stroke-width="2" rx="3"/>
        <circle cx="${round(a.x) * 100}%" cy="${round(a.y) * 100}%" r="11"
                fill="var(--box)" stroke="var(--box)" stroke-width="2"/>
        <text x="${round(a.x) * 100}%" y="${round(a.y) * 100}%" dy="4.5"
              text-anchor="middle">${label}</text></g>`;
    } else {
      svg += `<g class="marker${s}" data-id="${a.id}">
        <circle cx="${round(a.x) * 100}%" cy="${round(a.y) * 100}%" r="12"
                fill="var(--pin)" stroke="var(--pin)" stroke-width="2"/>
        <text x="${round(a.x) * 100}%" y="${round(a.y) * 100}%" dy="4.5"
              text-anchor="middle">${label}</text></g>`;
    }
  });
  if (drag) {
    const x = Math.min(drag.x0, drag.x1) * 100, y = Math.min(drag.y0, drag.y1) * 100;
    const w = Math.abs(drag.x1 - drag.x0) * 100, h = Math.abs(drag.y1 - drag.y0) * 100;
    svg += `<rect x="${x}%" y="${y}%" width="${w}%" height="${h}%" fill="rgba(90,209,164,.10)"
            stroke="var(--box)" stroke-dasharray="4 3" stroke-width="2"/>`;
  }
  ovEl.innerHTML = svg;
  ovEl.querySelectorAll(".marker").forEach(g =>
    g.addEventListener("pointerdown", e => {
      e.stopPropagation(); sel = g.dataset.id; syncSelection();
      document.querySelector(`.note[data-id="${sel}"]`)?.scrollIntoView({ block: "nearest" });
    }));
}

function renderNotes() {
  const host = $("#notes");
  if (!anns.length) { host.innerHTML = '<div class="empty">No annotations yet.</div>'; return; }
  host.innerHTML = "";
  anns.forEach((a, i) => {
    const el = document.createElement("div");
    el.className = "note" + (a.id === sel ? " sel" : "");
    el.dataset.id = a.id;
    const colour = a.kind === "box" ? "var(--box)" : "var(--pin)";
    el.innerHTML = `
      <header>
        <span class="badge" style="background:${colour}">${i + 1}</span>
        <select>${TAGS.map(t => `<option ${t === a.tag ? "selected" : ""}>${t}</option>`).join("")}</select>
        <button class="del" title="Delete">×</button>
      </header>
      <textarea placeholder="What's wrong / what to change…">${a.note || ""}</textarea>`;
    el.onpointerdown = () => { sel = a.id; syncSelection(); };
    el.querySelector("select").onchange = e => { a.tag = e.target.value; setDirty(true); };
    el.querySelector("textarea").oninput = e => { a.note = e.target.value; setDirty(true); };
    el.querySelector(".del").onclick = e => {
      e.stopPropagation();
      anns = anns.filter(x => x.id !== a.id); sel = null; setDirty(true); render();
    };
    host.appendChild(el);
  });
}

// ---------- save ----------
async function save() {
  if (!current) return;
  const body = {
    image: current,
    image_size: [imgEl.naturalWidth, imgEl.naturalHeight],
    annotations: anns,
  };
  status("saving…");
  const r = await fetch("/api/annotations", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  }).then(r => r.json()).catch(() => ({ error: "network" }));
  if (r.error) { status("save failed: " + r.error); return; }
  setDirty(false); status(`saved ${r.count} note(s) → ${r.saved}`); loadBoards();
}

$("#save").onclick = save;
document.querySelectorAll("button[data-tool]").forEach(b => b.onclick = () => {
  tool = b.dataset.tool;
  document.querySelectorAll("button[data-tool]").forEach(x => x.classList.toggle("on", x === b));
  $("#tip").textContent = tool === "pin" ? "click to drop a pin" : "drag to draw a box";
});
addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key === "s") { e.preventDefault(); save(); }
  if (e.key === "Delete" && sel && document.activeElement.tagName !== "TEXTAREA") {
    anns = anns.filter(x => x.id !== sel); sel = null; setDirty(true); render();
  }
});
addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });

loadBoards();
</script>
</body>
</html>
